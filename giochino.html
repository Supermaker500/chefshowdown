<style>

let myNickname = 'Chef';

function startHosting(code){
  roomCode = code;
  isHostNode = true;
  if(peer){try{peer.destroy()}catch(e){}}
  
  const hostId = 'chefroom_' + roomCode;
  peer = new Peer(hostId);

  peer.on('open', id => {
    toast('Stanza "' + roomCode + '" creata con successo!');
    startGame();
  });

  peer.on('connection', conn => {
    clientConns[conn.peer] = conn;
    conn.on('data', data => {
      if(data.type === 'join'){
        remotePlayers[conn.peer] = {name: data.name, x: 0, z: 1.5, r: 0, hs: ''};
        broadcastNames();
      } else if(data.type === 'act'){
        handle(data.k, conn.peer);
        broadcastState();
      } else if(data.type === 'pos'){
        if(remotePlayers[conn.peer]){
          remotePlayers[conn.peer].x = data.x;
          remotePlayers[conn.peer].z = data.z;
          remotePlayers[conn.peer].r = data.r;
          remotePlayers[conn.peer].hs = data.hs;
        }
        broadcastToOthers(conn.peer, data);
      }
    });
    conn.on('close', () => {
      delete clientConns[conn.peer];
      delete remotePlayers[conn.peer];
      broadcastNames();
    });
    conn.send({type: 'state', state: S});
  });

  peer.on('error', err => {
    toast('Errore: Codice stanza già esistente o occupato!');
  });
}

function joinHosting(code){
  roomCode = code;
  isHostNode = false;
  if(peer){try{peer.destroy()}catch(e){}}

  peer = new Peer();

  peer.on('open', id => {
    myPeerId = id;
    const hostId = 'chefroom_' + roomCode;
    connHost = peer.connect(hostId);

    connHost.on('open', () => {
      toast('Entrato nella stanza!');
      connHost.send({type: 'join', name: myNickname});
      startGame();
    });

    connHost.on('data', data => {
      if(data.type === 'state'){
        S = data.state;
      } else if(data.type === 'remote_pos'){
        if(!remotePlayers[data.peer]){
          remotePlayers[data.peer] = {name: data.name || 'Chef', x: data.x, z: data.z, r: data.r, hs: data.hs};
        } else {
          remotePlayers[data.peer].x = data.x;
          remotePlayers[data.peer].z = data.z;
          remotePlayers[data.peer].r = data.r;
          remotePlayers[data.peer].hs = data.hs;
          if(data.name) remotePlayers[data.peer].name = data.name;
        }
      } else if(data.type === 'names_update'){
        data.players.forEach(p => {
          if(p.id !== myPeerId && remotePlayers[p.id]){
            remotePlayers[p.id].name = p.name;
          }
        });
      }
    });

    connHost.on('close', () => {
      toast('Connessione persa con l host.');
    });
  });

  peer.on('error', err => {
    toast('Impossibile trovare la stanza. Controlla il codice!');
  });
}

function broadcastState(){
  if(!isHostNode) return;
  for(let id in clientConns){
    clientConns[id].send({type: 'state', state: S});
  }
}

function broadcastToOthers(senderId, data){
  for(let id in clientConns){
    if(id !== senderId){
      clientConns[id].send({type: 'remote_pos', peer: senderId, name: remotePlayers[senderId]?.name || 'Chef', ...data});
    }
  }
}

function broadcastNames(){
  if(!isHostNode) return;
  const list = [{id: myPeerId, name: myNickname}];
  for(let id in remotePlayers){
    list.push({id: id, name: remotePlayers[id].name});
  }
  for(let id in clientConns){
    clientConns[id].send({type: 'names_update', players: list});
  }
}

  const hat=t0=>{const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=7000;const g=AC.createGain();g.gain.setValueAtTime(.02,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+.05);s.connect(f);f.connect(g);g.connect(musicG);s.start(t0,Math.random());s.stop(t0+.06)};
  setInterval(()=>{if(!AC)return;while(t<AC.currentTime+1.5){const ch=CH[bi%4];ch.forEach(m=>note(M(m),t,bar*1.05,.05,'triangle',pad));note(M(ch[0]-12),t,bar*.45,.09,'sine',pad);note(M(ch[0]-12),t+bar/2,bar*.4,.07,'sine',pad);
    const n=2+Math.floor(Math.random()*2);for(let i=0;i<n;i++)note(M(PE[Math.floor(Math.random()*PE.length)]),t+bar*(i/n)+Math.random()*.2,.9,.035,'sine',mel);
    [1,3].forEach(b=>hat(t+b*bar/4));t+=bar;bi++}},400)}
$('vm').value=vol.m*100;$('vs').value=vol.s*100;$('vm').oninput=()=>{vol.m=$('vm').value/100;setVol()};$('vs').oninput=()=>{vol.s=$('vs').value/100;setVol();tapS()};
$('gear').onclick=()=>$('set').classList.toggle('on');$('setx').onclick=()=>$('set').classList.remove('on');

const FACE=f=>f>.6?'😊':f>.3?'😐':'😠';
function ui(){
  $('hearts').innerHTML=[0,1,2].map(i=>'<span class="h" style="--p:'+Math.max(0,Math.min(2,S.hp-2*i))*50+'%">♥</span>').join('');
  $('held').textContent='In mano: '+(S.h[myPeerId]?EM[S.h[myPeerId]]:'niente');
  if(playing&&!S.ov){const key=S.ph+S.rd;
    if(S.ph==='b'&&shownDay!==key){shownDay=key;const b=S.bill||{};banner('Round '+(S.rd-1)+' superato!','Punti: '+b.pf+' su '+b.tg)}
    else if(S.ph==='p'&&shownDay!==key){shownDay=key;banner('Round '+S.rd,'Obiettivo: '+S.tg+' punti'+(S.rd===3?' · Novità: insalata 🥗':''))}}
  $('score').textContent=S.sc;$('score').style.color='';if(lastSc!==null&&S.sc!==lastSc&&Math.abs(S.sc-lastSc)<=30){floatMoney(S.sc-lastSc);if(S.sc>lastSc)Object.values(pl).forEach(q=>q.ch=.9)}lastSc=S.sc;if(S.hp<lastHp)Object.values(pl).forEach(q=>q.sd=.9);lastHp=S.hp;$('rd').textContent='Round '+S.rd+' · punti '+(S.sc-S.rs)+'/'+S.tg+' · '+(S.tm>0?fmtT(S.tm):'ultimi clienti');
  
  $('online').textContent = roomCode ? ('Stanza: ' + roomCode) : 'Solo';
  const nu=performance.now(),du=Math.min(.1,(nu-(ui.lu||nu))/1000);ui.lu=nu;
  [0,1,2].forEach(i=>{const c=S.cu[i],b=$('b'+i),m=cuM[i],u=m.userData,tx=ST[8+i].x;if(!u.st)u.st='out';
    if(c&&u.st==='out'){u.st='in';m.position.x=i===0?-10.5:i===2?10.5:(Math.random()<.5?-10.5:10.5);m.visible=true}
    else if(c&&u.st==='leave')u.st='in';
    else if(!c&&(u.st==='in'||u.st==='stay'))u.st='leave';
    if(u.st==='in'||u.st==='leave'){const gx=u.st==='in'?tx:(m.position.x<0?-10.8:10.8),dx=gx-m.position.x,sp=3.4*du;
      if(Math.abs(dx)<=sp){m.position.x=gx;u.st=u.st==='in'?'stay':'out';if(u.st==='out')m.visible=false}else{m.position.x+=Math.sign(dx)*sp;m.rotation.y=Math.sign(dx)*Math.PI/2}
      const w=Math.sin(nu/85);u.legs[0].rotation.x=w*.8;u.legs[1].rotation.x=-w*.8;u.arms[0].rotation.x=-w*.6;u.arms[1].rotation.x=w*.6;u.body.position.y=Math.abs(w)*.06;m.position.y=0;m.rotation.z=0}
    else if(u.st==='stay'){m.rotation.y=0;u.legs.forEach(l=>l.rotation.x=0);u.arms[0].rotation.x=0;u.arms[1].rotation.x=0;u.body.position.y=Math.sin(nu/420+i)*.012}
    m.visible=u.st!=='out';if(c&&u.st==='stay'){const T0=performance.now();m.position.y=c.joy>0?Math.abs(Math.sin(T0/90))*.25:0;m.rotation.z=c.sick>0?Math.sin(T0/40)*.18:(c.l/c.m<.18&&!c.done)?Math.sin(T0/60)*.08:0}if(!c||u.st!=='stay'){b.style.display='none';return}
    const v=new T.Vector3(ST[8+i].x,2.3,-4.3).project(cam);b.style.display='block';b.style.left=(v.x*.5+.5)*innerWidth+'px';b.style.top=(-v.y*.5+.5)*innerHeight+'px';
    const f=Math.max(0,c.l/c.m),em=c.sick>0?'🤮':c.joy>0||c.done>0?'😍':f<.18?'😡':FACE(f),col=f>.6?'#4fcf84':f>.3?'#ffc83d':'#ff5a4d';
    b.className='bub'+(c.fast?' fast':'');
    b.innerHTML='<div class="ring" style="background:conic-gradient('+col+' '+(f*100)+'%,#d9ccdd 0)"><div class="rf">'+em+'</div></div>'+(c.fast?'<div class="zap">⚡</div>':'')+['🍔','🍟','🥤','🥗'].map((e,k)=>c.d[k]?'<span>'+e+(c.o[k]>0?'×'+c.o[k]:'✅')+'</span>':'').join(' ')+'<u class="t1"></u><u class="t2"></u>'});
  if(S.ov&&playing){const k=S.rd+':'+S.sc+':'+S.cs+':'+S.lc,fs=Math.round(S.sc+100*(S.rd-1)+10*S.cs);if(k!==finKey){finKey=k;if(fs>bestS){bestS=fs;try{localStorage.setItem('chefBest3',fs)}catch(e){}}
    $('ovt').innerHTML=(S.why||'')+'<br><span class="big">Punteggio '+fs+'</span><br>Round completati: '+(S.rd-1)+' · Clienti serviti: '+S.cs+' · Persi: '+S.lc+'<br>Record '+bestS}$('over').classList.add('on')}else $('over').classList.remove('on');
}
const PV=[{hs:'',it:null,x:.9,z:4.2},{hs:'',it:null,x:2.5,z:4.2}];
function drinkVis(){const v=vis.dk,d=S.dk||{s:'e',t:0};if(!v)return;
  if(!v.rg){v.rg=document.createElement('div');v.rg.className='ring2';v.rg.innerHTML='<div class="rf"></div>';document.body.appendChild(v.rg)}
  v.g.visible=d.s!=='e';if(d.s==='e'||!playing){v.rg.style.display='none';return}
  const pr=d.s==='r'?1:Math.min(1,d.t/DK);v.liq.scale.y=Math.max(.02,pr);v.liq.position.y=-.12+.12*Math.max(.02,pr);v.ice.forEach(q=>q.visible=pr>.75);
  const pt=new T.Vector3(v.x,1.7,v.z).project(cam);v.rg.style.display='block';v.rg.style.left=(pt.x*.5+.5)*innerWidth+'px';v.rg.style.top=(-pt.y*.5+.5)*innerHeight+'px';
  v.rg.style.background='conic-gradient('+(d.s==='r'?'#4fcf84':'#ffc83d')+' '+pr*100+'%,#d9ccdd 0)';v.rg.firstChild.textContent=d.s==='r'?'✅':'🥤'}
function plateVis(){PV.forEach((q,i)=>{const k=S.pl&&S.pl[i]||'';if(q.hs===k)return;q.hs=k;if(q.it){scene.remove(q.it);q.it=null}if(k){q.it=makeItem(k);q.it.position.set(q.x,1.03,q.z);scene.add(q.it)}})}
function cookVis(){[['gr',0],['gr',1],['fr',0],['fr',1]].forEach(([k,i])=>{const s=S[k][i],v=vis[(k==='gr'?'gr':'fr')+i],fry=k==='fr';
  v.b.visible=false;v.ic.visible=false;v.o.visible=s.s!=='e';
  if(!v.rg){v.rg=document.createElement('div');v.rg.className='ring2';v.rg.innerHTML='<div class="rf"></div>';document.body.appendChild(v.rg)}
  if(s.s==='e'||!playing){v.rg.style.display='none';return}
  const raw=fry?0xf3e19a:0xe8788a,done=fry?0xe0a730:0x7a3b1e,bur=0x1a1008;
  const cc=s.s==='c'?lerpC(raw,done,s.t/MAX):s.s==='r'?lerpC(done,bur,(s.t-MAX)/(BURN-MAX)*.7):new T.Color(bur);(v.o.userData.rc||[v.o]).forEach(q=>q.material.color=cc.clone());
  const pr=s.s==='c'?s.t/MAX:s.s==='r'?1-(s.t-MAX)/(BURN-MAX):1,col=s.s==='c'?'#ffc83d':s.s==='b'?'#ff5a4d':pr>.4?'#4fcf84':'#ff5a4d',em=s.s==='c'?(fry?'🍟':'🥩'):s.s==='r'?(s.t>BURN-3?'⚠️':'✅'):'🔥';
  const pt=new T.Vector3(v.x,1.95,v.z).project(cam);v.rg.style.display='block';v.rg.style.left=(pt.x*.5+.5)*innerWidth+'px';v.rg.style.top=(-pt.y*.5+.5)*innerHeight+'px';
  v.rg.style.background='conic-gradient('+col+' '+Math.max(0,Math.min(1,pr))*100+'%,#d9ccdd 0)';v.rg.firstChild.textContent=em})}

let last=performance.now(),tS=0,tP=0,lastSent='';
function frame(n){const dt=Math.min(.1,(n-last)/1000);last=n;
  let mv=false;
  if(playing&&!S.ov){let dx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.x,dz=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)+joy.z;const l=Math.hypot(dx,dz);
    if(l>.05){goal=null;pend=null;if(l>1){dx/=l;dz/=l}step(dx,dz,dt);mv=true}
    else if(goal){if(pend){const q=ST.find(z=>z.id===pend);if(Math.hypot(q.x-mine.x,q.z-mine.z)<1.25){mine.r=Math.atan2(q.x-mine.x,q.z-mine.z);act(pend);pend=null;goal=null}}
      if(goal){const gx=goal.x-mine.x,gz=goal.z-mine.z,d=Math.hypot(gx,gz);if(d<.05)goal=null;else{step(gx/d,gz/d,dt,d);mv=true}}}}
  mk.visible=!!goal&&!pend;if(goal){mk.position.x=goal.x;mk.position.z=goal.z}

  if(playing&&isHostNode){hostTick(dt);tS+=dt;if(tS>.25){tS=0;broadcastState()}}

  tP+=dt;
  if(playing && tP>.15){
    tP=0;
    const myPosData = {type: 'pos', x: +mine.x.toFixed(2), z: +mine.z.toFixed(2), r: +mine.r.toFixed(2), hs: S.h[myPeerId]||''};
    if(isHostNode){
      broadcastToOthers(myPeerId, myPosData);
    } else if(connHost && connHost.open){
      connHost.send(myPosData);
    }
  }

  const mp=getP(myPeerId, myNickname);mp.g.position.set(mine.x,0,mine.z);mp.g.rotation.y=mine.r;mp.g.visible=playing;ring.position.x=mine.x;ring.position.z=mine.z;ring.visible=playing;setHold(mp,S.h[myPeerId]||null);anim(mp,mv,n/1000,dt);

  const seen={};
  seen[myPeerId]=1;
  for(let id in remotePlayers){
    const rp=remotePlayers[id];
    seen[id]=1;
    const q=getP(id, rp.name || 'Chef');
    const ox=q.g.position.x,oz=q.g.position.z;
    q.g.position.x+=(rp.x-ox)*.3;
    q.g.position.z+=(rp.z-oz)*.3;
    q.g.rotation.y=rp.r||0;
    q.g.visible=true;
    setHold(q, rp.hs||'');
    anim(q, Math.hypot(q.g.position.x-ox, q.g.position.z-oz)>.004, n/1000, dt);
  }

  Object.keys(pl).forEach(k=>{if(!seen[k]){scene.remove(pl[k].g);delete pl[k]}});
  if(salG)salG.visible=S.rd>=3;cookVis();drinkVis();plateVis();soundWatch();ui();ren.render(scene,cam);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
