<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Chef Showdown</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    /* 1. STILI DELLA LOBBY E DEL MENU */
    body { font-family: sans-serif; background: #2c3e50; color: #fff; text-align: center; }
    .card { background: #34495e; padding: 20px; border-radius: 10px; display: inline-block; margin-top: 50px; }
    input, button { padding: 10px; margin: 5px; border-radius: 5px; border: none; }
    button { background: #27ae60; color: white; cursor: pointer; font-weight: bold; }
    .hidden { display: none !important; }

    /* 2. INSERISCI QUI ANCHE I TUOI VECCHI STILI CSS DEL GIOCO (SE NE AVEVI) */
  </style>
</head>
<body>

  <!-- INTERFACCIA MENU -->
  <div id="menuScreen" class="card">
    <h1>Chef Showdown</h1>
    <input type="text" id="nicknameInput" placeholder="Il tuo Nickname">
    <br>
    <button onclick="createLobby()">Crea Stanza</button>
    <hr>
    <input type="text" id="roomCodeInput" placeholder="Codice Stanza">
    <button onclick="joinLobby()">Entra nella Stanza</button>
  </div>

  <!-- INTERFACCIA LOBBY -->
  <div id="lobbyScreen" class="card hidden">
    <h2>Lobby</h2>
    <p>Codice: <strong id="displayRoomCode">---</strong></p>
    <p>Link da inviare: <input type="text" id="shareLinkInput" readonly></p>
    <div id="playerList"></div>
    <br>
    <button id="startGameBtn" class="hidden" onclick="startGame()">Avvia Partita</button>
  </div>

  <!-- CANVAS / ELEMENTI DEL TUO GIOCO -->
  <canvas id="gameCanvas" width="800" height="600" style="display:none;"></canvas>

  <script>
    // --- GESTIONE PEERJS & LOBBY ---
    let peer = null, connections = [], isHost = false, roomCode = '', players = [];

    window.addEventListener('load', () => {
      const roomParam = new URLSearchParams(window.location.search).get('room');
      if (roomParam) document.getElementById('roomCodeInput').value = roomParam;
    });

    function createLobby() {
      roomCode = Math.random().toString(36).substring(2, 7).toUpperCase();
      isHost = true;
      peer = new Peer('chefshowdown-' + roomCode);
      peer.on('open', () => {
        setupLobby();
        players.push({ id: peer.id, name: document.getElementById('nicknameInput').value || 'Host' });
        document.getElementById('startGameBtn').classList.remove('hidden');
      });
      peer.on('connection', c => {
        connections.push(c);
        c.on('data', d => { if(d.type==='JOIN'){ players.push({id:c.peer, name:d.name}); broadcast({type:'PL', p:players}); updateList(); }});
      });
    }

    function joinLobby() {
      roomCode = document.getElementById('roomCodeInput').value.toUpperCase();
      peer = new Peer();
      peer.on('open', () => {
        const c = peer.connect('chefshowdown-' + roomCode);
        c.on('open', () => {
          connections.push(c);
          c.send({ type: 'JOIN', name: document.getElementById('nicknameInput').value || 'Guest' });
          setupLobby();
        });
        c.on('data', d => {
          if (d.type === 'PL') { players = d.p; updateList(); }
          if (d.type === 'START') launchGame();
        });
      });
    }

    function setupLobby() {
      document.getElementById('menuScreen').classList.add('hidden');
      document.getElementById('lobbyScreen').classList.remove('hidden');
      document.getElementById('displayRoomCode').innerText = roomCode;
      document.getElementById('shareLinkInput').value = window.location.origin + window.location.pathname + '?room=' + roomCode;
    }

    function updateList() {
      document.getElementById('playerList').innerHTML = players.map(p => '<div>' + p.name + '</div>').join('');
    }

    function broadcast(d) { connections.forEach(c => c.open && c.send(d)); }

    function startGame() {
      broadcast({ type: 'START' });
      launchGame();
    }

    function launchGame() {
      document.getElementById('lobbyScreen').classList.add('hidden');
      document.getElementById('gameCanvas').style.display = 'block';
      
      // AVVIA IL TUO GIOCO VERO
      initGameLogic();
    }

    // =========================================================
    // INCOLLA QUI SOTTO IL CODICE ORIGINALE DEL TUO GIOCO!
    // =========================================================
    function initGameLogic() {
      
      // 1. Qui incolli le tue variabili (es. player, tasti premuti, mappa)
      // 2. Qui incolli i tuoi EventListener per la tastiera (frecce, tasto E, ecc.)
      // 3. Qui incolli la funzione update() e la funzione di ciclo del canvas (requestAnimationFrame)

    }
  </script>
</body>
</html>
